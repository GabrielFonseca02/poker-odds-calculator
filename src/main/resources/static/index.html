<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Poker Odds Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Poker Odds Calculator</h1>

<form id="odds-form">

    <fieldset>
        <legend>Sua mão</legend>
        <div id="hero-cards" class="card-inputs"></div>
    </fieldset>

    <fieldset>
        <legend>Cartas da mesa</legend>
        <p class="hint">Deixe em branco o que ainda não abriu</p>
        <div id="community-cards" class="card-inputs"></div>
    </fieldset>

    <fieldset>
        <legend>Configuração da simulação</legend>

        <label>
            Número de oponentes
            <input type="number" id="opponents" min="1" max="9" value="1">
        </label>

        <label>
            Número de simulações
            <input type="number" id="simulations" min="1000" max="200000" step="1000" value="10000">
        </label>
    </fieldset>

    <button type="submit">Calcular odds</button>

</form>

<div id="resultado"></div>

<script src="script.js"></script>
</body>
</html>
